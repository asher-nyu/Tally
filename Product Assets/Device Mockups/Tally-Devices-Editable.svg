<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="4000" height="2662" viewBox="0 0 4000 2662" fill="none" role="img" aria-labelledby="artwork-title artwork-description">
<title id="artwork-title">Tally on Mac, iPhone, and iPad</title>
<desc id="artwork-description">Editable device illustration featuring a Silver 16-inch MacBook Pro, a Burgundy iPhone 18 Pro Max, and a Purple 13-inch iPad Air. Each screen contains an unchanged Tally screenshot from a fictional scenario. The screen images and background are independently replaceable.</desc>
<metadata>Original illustration by Asher Bloom for Tally. Canvas 4000 × 2662. Editable screen-image IDs: mac-screen, iphone-screen, ipad-screen. Background ID: background-image.</metadata>
<defs>
  <linearGradient id="silver-edge" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#fcfdfe"/><stop offset=".2" stop-color="#a0a5aa"/><stop offset=".54" stop-color="#d7d9dc"/><stop offset=".8" stop-color="#8e959c"/><stop offset="1" stop-color="#e8e9eb"/></linearGradient>
  <linearGradient id="silver-deck" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c6cacf"/><stop offset=".22" stop-color="#f0f1f2"/><stop offset=".58" stop-color="#d4d8db"/><stop offset="1" stop-color="#a6aeb4"/></linearGradient>
  <linearGradient id="silver-lip" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eff1f3"/><stop offset=".2" stop-color="#b5bcc2"/><stop offset=".75" stop-color="#9da4aa"/><stop offset="1" stop-color="#6b7278"/></linearGradient>
  <linearGradient id="glass-edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45474a"/><stop offset=".42" stop-color="#111214"/><stop offset="1" stop-color="#292b2e"/></linearGradient>
  <linearGradient id="burgundy-metal" x1="0" y1="0" x2="1" y2=".15"><stop stop-color="#472732"/><stop offset=".04" stop-color="#c1909c"/><stop offset=".11" stop-color="#784552"/><stop offset=".38" stop-color="#5a303e"/><stop offset=".76" stop-color="#764450"/><stop offset=".96" stop-color="#a06b77"/><stop offset="1" stop-color="#3d1c28"/></linearGradient>
  <linearGradient id="burgundy-button" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3a1925"/><stop offset=".45" stop-color="#965e6c"/><stop offset="1" stop-color="#512e3b"/></linearGradient>
  <linearGradient id="purple-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2dbea"/><stop offset=".18" stop-color="#bcb0ce"/><stop offset=".5" stop-color="#89799f"/><stop offset=".72" stop-color="#c5b8d5"/><stop offset="1" stop-color="#857493"/></linearGradient>
  <linearGradient id="rim-highlight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".65"/><stop offset=".4" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".32"/></linearGradient>
  <radialGradient id="lens"><stop stop-color="#2e4a62"/><stop offset=".45" stop-color="#142334"/><stop offset="1" stop-color="#080b10"/></radialGradient>
  <filter id="device-shadow" x="-.2" y="-.15" width="1.5" height="1.6" color-interpolation-filters="sRGB"><feDropShadow dx="3" dy="40" stdDeviation="30" flood-color="#03060b" flood-opacity=".34"/><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#020306" flood-opacity=".42"/></filter>
  <filter id="ground-blur" x="-.3" y="-2" width="1.6" height="5"><feGaussianBlur stdDeviation="22"/></filter>
  <clipPath id="mac-screen-mask"><rect x="21" y="22" width="2098" height="1356.403935" rx="21"/></clipPath>
  <clipPath id="phone-screen-mask"><rect x="14" y="12" width="502" height="1090.690909" rx="74"/></clipPath>
  <clipPath id="ipad-screen-mask"><rect x="39" y="37" width="1352" height="1013.499268" rx="13"/></clipPath>
</defs>

<!-- REPLACEABLE BACKGROUND. Change this image or hide the entire Background group. -->
<g id="background" inkscape:groupmode="layer" inkscape:label="01 · Background — replaceable">
  <image id="background-image" data-asset="background" xlink:href="assets/background.svg" x="0" y="0" width="4000" height="2662" preserveAspectRatio="xMidYMid slice"/>
</g>

<!-- DEVICE GROUPS. Screens preserve the complete native source aspect ratio. -->
